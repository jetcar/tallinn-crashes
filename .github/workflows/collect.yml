name: collect

on:
  schedule:
    - cron: "7 * * * *"   # hourly: Waze feed; official data refreshed once a day at 04:07 UTC
  workflow_dispatch:
    inputs:
      official:
        description: "Refresh Transpordiamet data now"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Waze accidents
        env:
          WAZE_FEED_URL: ${{ secrets.WAZE_FEED_URL }}
        if: env.WAZE_FEED_URL != ''
        run: python scripts/waze_feed.py

      - name: Transpordiamet injury crashes
        if: github.event_name == 'schedule' || inputs.official
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" != "04" ] \
             && [ -f data/official/tallinn_crashes.csv ]; then
            echo "not 04 UTC, skipping"; exit 0
          fi
          python scripts/official.py

      - name: Report
        run: python scripts/report.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data REPORT.md
          if git diff --cached --quiet -- data; then
            echo "no data changes"; exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
